server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name localhost _;

    # 1. Đường dẫn tĩnh (Static Content)
    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # 2. Reverse Proxy cho các yêu cầu API chuyển tiếp sang Spring Boot (Port 8082)
    location /api/ {
        proxy_pass http://127.0.0.1:8082/;
        
        # Thiết lập các tiêu đề HTTP để Backend nhận diện đúng Client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình timeout và kết nối
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Tùy chọn xử lý trang lỗi
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
